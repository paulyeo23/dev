<html>
  <!DOCTYPE html>
  <head>
    <style>
      path.link0 {
        fill: none;
        stroke: gray;
        stroke-width: 1.5px;
        stroke-dasharray: none;
      }

      path.link1 {
        fill: none;
        stroke: green;
        stroke-width: 1.5px;
        stroke-dasharray: 5;
      }

      circle {
        /* fill: #ccc; */
        stroke: #fff;
        stroke: black;
        stroke-width: 1.5px;
      }

      text {
        fill: #000;
        font: 10px sans-serif;
        pointer-events: none;
      }
    </style>
    <meta charset="utf-8" />
    <title></title>
  </head>

  <body>
    <script type="text/javascript" src="../lib/d3.v5.min.js"></script>
    <script>
      const sourceCount = {};
      d3.dsv(",", "board_games.csv", function (d) {
        return {
          source: d.source,
          target: d.target,
          value: +d.value,
        };
      })
        .then(function (data) {
          const generateNodes = (data) => {
            const nodesMap = new Map();
            const d3Data = { nodes: [], links: [] };

            data.forEach((entry, index) => {
              if (!sourceCount[entry.source]) {
                sourceCount[entry.source] = 1;
              } else {
                sourceCount[entry.source] += 1;
              }
              if (!nodesMap.has(entry.source)) {
                nodesMap.set(entry.source, { id: entry.source });
              }
              if (!nodesMap.has(entry.target)) {
                nodesMap.set(entry.target, { id: entry.target });
              }

              d3Data.links.push({
                source: entry.source,
                target: entry.target,
                value: entry.value,
                index: index,
              });
            });

            d3Data.nodes = Array.from(nodesMap.values());

            return d3Data;
          };
          const graphData = generateNodes(data);
          var links = graphData.links;
          var nodes = graphData.nodes;

          const maxCount = Math.max(...Object.values(sourceCount).map(Number));
          console.log(maxCount);
          const maxRange = 100;
          const colorMultiplier = maxRange / maxCount;
          const radiusMultiplier = 4;

          const colorGenerator = (id) => {
            if (!sourceCount[id]) {
              return "#ccc";
            } else {
              console.log(Number(sourceCount[id]) * colorMultiplier);
              return colorScale(sourceCount[id] * colorMultiplier);
            }
          };

          const colorScale = d3
            .scaleSequential(d3.interpolateViridis)
            .domain([0, maxRange]);

          // compute the distinct nodes from the links.
          //   links.forEach(function (link) {
          //     link.source =
          //       nodes[link.source] ||
          //       (nodes[link.source] = { name: link.source });
          //     link.target =
          //       nodes[link.target] ||
          //       (nodes[link.target] = { name: link.target });
          //   });

          console.log(links);
          console.log(nodes);
          console.log(sourceCount);

          var width = 1200,
            height = 700;

          var force = d3
            .forceSimulation(nodes)
            .force(
              "link",
              d3
                .forceLink(links)
                .id(function (d) {
                  return d.id;
                })
                .distance(100)
            )
            .force("center", d3.forceCenter(width / 2, height / 2))
            .force("x", d3.forceX())
            .force("y", d3.forceY())
            .force("charge", d3.forceManyBody().strength(-250))
            .alphaTarget(1)
            .on("tick", tick);

          var svg = d3
            .select("body")
            .append("svg")
            .attr("width", width)
            .attr("height", height);

          // add the links
          var path = svg
            .append("g")
            .selectAll("path")
            .data(links)
            .enter()
            .append("path")
            .attr("class", function (d) {
              return "link" + d.value;
            });

          // define the nodes
          var node = svg
            .append("g")
            .attr("class", "nodes")
            .selectAll("g")
            .data(force.nodes())
            .enter()
            .append("g")
            .attr("class", "node")
            .call(
              d3
                .drag()
                .on("start", dragstarted)
                .on("drag", dragged)
                .on("end", dragended)
            )
            .on("dblclick", (event, d) => dblClicked(event, d));
          // add the nodes
          node
            .append("circle")
            .attr("id", function (d) {
              return d.id.replace(/\s+/g, "").toLowerCase();
            })
            .attr("r", (d) => {
              if (!sourceCount[d.id]) {
                return "5";
              } else {
                return sourceCount[d.id] * radiusMultiplier;
              }
            })
            .attr("fill", (d) => {
              return colorGenerator(d.id);
            });

          node
            .append("text")
            .text(function (d) {
              return d.id;
            })
            .attr("text-anchor", "start")
            .attr("dominant-baseline", "hanging")
            .attr("pointer-events", "none")
            .attr("dx", (d) => {
              if (!sourceCount[d.id]) {
                return "10px";
              } else {
                return (sourceCount[d.id] * radiusMultiplier) / 1.5 + 10;
              }
            })
            .attr("dy", (d) => {
              if (!sourceCount[d.id]) {
                return "-10px";
              } else {
                return -1 * ((sourceCount[d.id] * radiusMultiplier) / 1.5 + 10);
              }
            })
            .attr("font-weight", "bold");

          // add the curvy lines
          function tick() {
            path.attr("d", function (d) {
              var dx = d.target.x - d.source.x,
                dy = d.target.y - d.source.y,
                dr = Math.sqrt(dx * dx + dy * dy);
              return (
                "M" +
                d.source.x +
                "," +
                d.source.y +
                "A" +
                dr +
                "," +
                dr +
                " 0 0,1 " +
                d.target.x +
                "," +
                d.target.y
              );
            });

            node.attr("transform", function (d) {
              return "translate(" + d.x + "," + d.y + ")";
            });
          }

          function dragstarted(d) {
            if (!event.active) {
              force.alphaTarget(0.3).restart();
            }
            d.fx = d.x;
            d.fy = d.y;
          }

          function dragged(d) {
            d.fx = d3.event.x;
            d.fy = d3.event.y;
          }

          function dragended(d) {
            if (!event.active) {
              force.alphaTarget(0);
            }
          }

          function dblClicked(d) {
            d.fx = null;
            d.fy = null;

            force.alphaTarget(0.3).restart();
          }
        })
        .catch(function (error) {
          console.log(error);
        });
    </script>
    <div id="signature">jyeo60</div>
  </body>
</html>
